experiment_name: BASELINE

seed: 1030
loss_type: MSE
epochs: 500
clip_max_norm: 1.0

model:
  type: DeepJSCC_lite
  min_SNRdB: 0
  max_SNRdB: 20
  spp: 0.5
  min_spp: 0.1
  dim: 96

optimizer:
  type: Adam
  learning_rate: 1e-4
  lr_milestone_epoch: []
  lr_gamma: 0.1

dataset:
  train_dataset: ~/datasets/ImageNet8000
  valid_dataset: ~/datasets/Kodak
  train_batch_size: 8
  valid_batch_size: 16
  num_workers: 16

logging:
  save_dir: 'logs/'
  save_model: True
  save_every: 50
  pretrain_ckpt: null
  
