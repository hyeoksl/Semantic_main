[project]
name = "sem-base"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "einops>=0.8",
    "jsonargparse>=4.0",
    "numpy>=1.26",
    "pillow>=10",
    "pyyaml>=6",
    "tensorboard>=2.0",
    "tqdm>=4.0",
    "torch==2.9",
    "torchvision>=0.24.0",
    "torchinfo>=1.8.0",
    "onnx>=1.23.2",
    "onnxruntime>=1.32.0",
]


[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
